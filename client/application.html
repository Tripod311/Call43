<div id="container">
    <header class="header">
        <h1>Call43</h1>
        <div data-ref="connectForm" id="connectForm" class="connect-form">
            <label class="sr-only" for="room-password">Пароль комнаты</label>
            <input data-ref="input" id="room-password" name="password" type="password" placeholder="Пароль комнаты" autocomplete="off" required />
            <button data-ref="button" type="submit">Подключиться</button>
        </div>
    </header>

    <main data-ref="content" class="main">
        
    </main>

    <div data-style='selfVideo' class="self-preview">
        <video
            data-ref="selfVideo"
            class="self-video"
            autoplay
            muted
            playsinline
        ></video>

        <div class="self-controls">
            <button
                data-ref="microphoneButton"
                class="self-control"
                type="button"
                aria-label="Выключить микрофон"
            >
                <img data-prop-src="micButton" style="width: 24px; height: 24px" />
            </button>

            <button
                data-ref="cameraButton"
                class="self-control"
                type="button"
                aria-label="Выключить камеру"
            >
                <img data-prop-src="camButton" style="width: 24px; height: 24px" />
            </button>
        </div>
    </div>
</div>
